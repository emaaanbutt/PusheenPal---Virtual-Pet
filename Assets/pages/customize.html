<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PusheenPal-Customize your pet</title>
    <link rel="stylesheet" href="../CSS/customize.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="../scripts/customize.js"></script>
</head>
<body>
      <div id="container">
        <h2>Name your PusheenPal</h2>
        <input type="text" id="name" placeholder="Meowbaksh">
        <h2>Choose the perfect room for your cat🎨</h2>
      </div>

      <div id="img-container">
        <div id="pink">
            <img class="image" src="../Images/pink-bg-room.jpg" alt="pink room">
        </div>
        <div id="blue">
            <img class="image" src="../Images/blue-bg-room.jpg" alt="blue room">
        </div>
        <div id="neutral">
            <img class="image" src="../Images/neutral-bg-room.jpg" alt="neutral room">
        </div>
      </div>

      <div id="con">
        <div id="start-button">
            START
          </div>
      </div>

</body>
</html>
