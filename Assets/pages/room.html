<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PusheenPal</title>
    <link rel="stylesheet" href="../CSS/room.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="../scripts/room.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <h2 id="intro"></h2>
        <img id="cat" src="../Images/cat-simple.png" alt="pusheen cat">
    </div>

    <div id="eat-button" class="button">
        EAT
    </div>

    <div id="eat-container">
        <div id="pizza-button" class="button outlined-text">
            PIZZA
        </div>
    
        <div id="shake-button" class="button outlined-text">
            SHAKE
        </div>
    
        <div id="sushi-button" class="button outlined-text">
            SUSHI
        </div>
    </div>

    <div id="paint-button" class="button">
        PAINT
    </div>

    <div id="paint-area" style="display: none;">
    <div id="color-palette">
        <button class="color-btn" data-color="black" style="background: black;"></button>
        <button class="color-btn" data-color="red" style="background: red;"></button>
        <button class="color-btn" data-color="blue" style="background: blue;"></button>
        <button class="color-btn" data-color="green" style="background: green;"></button>
        <button class="color-btn" data-color="yellow" style="background: yellow;"></button>
        <button class="color-btn" data-color="pink" style="background: pink"></button>
        <button class="color-btn" data-color="purple" style="background: purple"></button>
        <button class="color-btn" data-color="brown" style="background: brown;"></button>
    </div>
    <canvas id="drawing-canvas"></canvas>
    <div id="paint-tools">
        <button id="eraser">Eraser</button>
        <button id="clear">Clear</button>
      </div>
    </div>

    <div id="hats-button" class="button">
        HATS
    </div>

    <div id="hats-display">
        <div>
            <img id="a1" class="arrow"  src="../Images/left-arrow.png" alt="left-arrow">
        </div>
        <div id="hat">
            <img src="../Images/hat1.png" alt="hat">
        </div>
        <div>
            <img id="a2" class="arrow" src="../Images/right-arrow.png" alt="right-arrow">
        </div>
    </div>




    <div id="start-sounds">
        <img id="sound-icon" src="../Images/no-sound.png" alt="sound button">
    </div>
    <audio id="bg-music" src="../audio/bg-music.mp3" loop></audio>
    <audio id="meow-sound" src="../audio/meow.mp3"></audio>

</body>
</html>
